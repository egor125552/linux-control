name: Server command bridge

on:
  push:
    branches:
      - main
    paths:
      - command.sh

jobs:
  execute:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout command
        uses: actions/checkout@v4

      - name: Execute command on server
        shell: bash
        run: |
          set -euo pipefail
          echo '===== RUNNER ====='
          whoami
          hostname
          echo '===== COMMAND ====='
          cat command.sh
          echo '===== OUTPUT ====='
          sudo -n bash ./command.sh
